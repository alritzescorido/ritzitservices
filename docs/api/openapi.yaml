openapi: 3.1.0
info:
  title: Livestock Price Board API
  version: 0.1.0-phase1
  summary: Phase 1 contract. Auth, farm and herd records, price board, admin verification and reference prices.
  description: |
    Stack-agnostic contract for the Phase 1 build (weeks 3 to 8). NestJS or Laravel
    can implement it unchanged. Phase 2 (listings, offers, deals) and Phase 3
    (shipments) will be added as separate tag groups without breaking these paths.

    Conventions
    - All responses are JSON. Errors use RFC 9457 `application/problem+json`.
    - Every mutating request from a mobile client carries `Idempotency-Key` so an
      offline queue can retry safely. Same key + same body returns the original
      response; same key + different body returns 422.
    - Lists are cursor paginated: `?cursor=&limit=` in, `next_cursor` out.
    - Money is a decimal string in Philippine pesos, e.g. "185.50". Never a float.
    - Weights are decimal strings in kilograms.
    - Timestamps are RFC 3339 UTC. Dates are `YYYY-MM-DD`.
    - Locations are PSGC codes (text). The client never sends free-text place names.
    - Every price returned carries `source`, `location_code` and `sample_count`.
      A client must display all three. A bare number is a defect.
    - Records that can be edited offline (farms, lots) carry `version`. PATCH must
      send `If-Match: <version>`; a stale version returns 409 with the server copy.

    Public board
    - `/prices/*`, `/locations/*` and `/weight-classes` are readable without a token,
      rate limited by IP. This is a product decision still open (proposal, "Decisions
      needed"). To make the board private, remove `security: []` from those
      operations; nothing else changes.
  contact:
    name: Livestock Price Board
servers:
  - url: https://api.staging.example.ph/v1
    description: Staging
  - url: https://api.example.ph/v1
    description: Production

tags:
  - name: Auth
    description: Phone number and one-time password login.
  - name: Me
    description: The signed-in user, roles, documents, devices, uploads.
  - name: Locations
    description: PSGC location tree. Public.
  - name: Farms
  - name: Lots
    description: Livestock lots, vaccination records, weight classes.
  - name: Prices
    description: Running price board. Public.
  - name: Marketplace
    description: |
      Phase 2. Listings from herd lots, offers and counter-offers, and deals driven by the
      state machine in the database (accepted, hauler_assigned, in_transit, delivered,
      settled, cancelled, disputed, refunded). Only a settled deal feeds the price board.
      Payment is off-platform in the pilot: the buyer records how they paid, the farmer
      confirms receipt, and only then does the deal settle. Listing needs a verified
      farmer; offering needs a verified buyer.
  - name: Logistics
    description: |
      Phase 3. Haulers keep a truck profile, pick jobs from accepted deals that need hauling,
      complete the pickup checklist (shipping permit, veterinary certificate, head count,
      load photo) before the trip can start, share position in transit, and hand over to the
      buyer, who still confirms count and weight. Jobs inside an active restricted zone for
      the species are not offered. Accepting a job needs a verified hauler.
  - name: Payments
    description: |
      Booking deposit (decision 3, model in docs/payments-paymongo.md). When a payment
      provider is configured, accepting an offer asks the buyer for 10% of the estimated
      total, at least 2,000 and at most 20,000 pesos, within 2 hours, through a hosted
      checkout. Until paid the deal shows deposit_status pending and no hauler job is
      published. Paid deposits are released to the farmer's payout account on settlement,
      forfeited to the farmer when the buyer cancels, refunded when the farmer cancels,
      and decided by the admin inside a dispute. Without a provider the deal behaves as
      before and deposit_required is false.

      The one charge carries two parts. The booking is the farmer assurance and is all
      the farmer is ever promised. The commission is the platform fee, added on top so
      it never reduces the farmer share, and earned only when the deal settles: a buyer
      who walks away forfeits the whole charge to the farmer, and a farmer who cancels
      means the buyer is refunded in full. Farmers are never charged a fee.
  - name: Sync
    description: Offline batch upload for mobile.
  - name: Admin
    description: Verification queue, reference prices, restricted zones, audit log. Admin role only.
  - name: Admin auth
    description: |
      Console sign-in for staff: work email, password, then a 6-digit authenticator code.
      No self-registration; a national admin creates accounts. Five failed attempts lock
      the account for 15 minutes. Sessions are the same bearer tokens as the mobile apps,
      with the admin role in the claims.
  - name: Ops

security:
  - bearerAuth: []

paths:

  # ------------------------------------------------------------------ Auth
  /auth/otp/request:
    post:
      tags: [Auth]
      operationId: requestOtp
      summary: Send a one-time password by SMS
      security: []
      description: |
        Rate limit: 3 per phone per 10 minutes, 10 per IP per hour. The response
        is identical whether or not the phone is registered, to avoid enumeration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  $ref: '#/components/schemas/PhoneE164'
      responses:
        '202':
          description: Challenge created and SMS queued.
          content:
            application/json:
              schema:
                type: object
                required: [challenge_id, expires_in_seconds, resend_after_seconds]
                properties:
                  challenge_id: { type: string, format: uuid }
                  expires_in_seconds: { type: integer, example: 300 }
                  resend_after_seconds: { type: integer, example: 60 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/otp/verify:
    post:
      tags: [Auth]
      operationId: verifyOtp
      summary: Exchange the code for tokens
      security: []
      description: |
        Five wrong codes invalidate the challenge. A new user is created on first
        successful verification with no roles; the client then calls `POST /me/roles`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_id, code]
              properties:
                challenge_id: { type: string, format: uuid }
                code: { type: string, pattern: '^[0-9]{6}$' }
                device:
                  $ref: '#/components/schemas/DeviceInfo'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: Wrong or expired code.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '423':
          description: Challenge locked after too many attempts. Request a new one.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Rotate the refresh token
      security: []
      description: Refresh tokens are single use. Reuse of a consumed token revokes the whole family.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: New pair.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke this device's refresh token
      responses:
        '204': { description: Revoked. }

  # ------------------------------------------------------------------ Me
  /me:
    get:
      tags: [Me]
      operationId: getMe
      summary: Current user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
    patch:
      tags: [Me]
      operationId: updateMe
      summary: Update name or language
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name: { type: string, minLength: 2, maxLength: 120 }
                preferred_lang: { $ref: '#/components/schemas/LangCode' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /me/roles:
    post:
      tags: [Me]
      operationId: addMyRole
      summary: Add farmer, buyer or hauler role
      description: |
        `admin` cannot be self-granted and returns 403. Adding a role does not
        verify it; verification is per user and reviewed by admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [farmer, buyer, hauler]
      responses:
        '200':
          description: Role added (idempotent).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /me/documents:
    get:
      tags: [Me]
      operationId: listMyDocuments
      summary: My uploaded documents and review status
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/UserDocument' }
    post:
      tags: [Me]
      operationId: registerMyDocument
      summary: Register an uploaded document
      description: |
        Two steps. First `POST /uploads` to get a pre-signed PUT URL and `storage_key`,
        upload the file directly to storage, then call this with the key.
        Documents are never served by URL; admin fetches them through `/admin/documents/{id}/file`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [doc_type, storage_key]
              properties:
                doc_type: { $ref: '#/components/schemas/DocType' }
                storage_key: { type: string }
      responses:
        '201':
          description: Created, status pending.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDocument' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /me/devices:
    post:
      tags: [Me]
      operationId: registerDevice
      summary: Register a push token for this device
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceInfo' }
      responses:
        '204': { description: Stored. }

  /uploads:
    post:
      tags: [Me]
      operationId: createUpload
      summary: Get a pre-signed upload URL
      description: |
        Purpose controls the bucket prefix and allowed types. Max 10 MB for documents,
        5 MB for photos. The server re-checks the object's content type after upload.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose, content_type, byte_size]
              properties:
                purpose:
                  type: string
                  enum: [user_document, farm_photo, lot_photo, vaccination_doc, shipment_photo]
                content_type:
                  type: string
                  enum: [image/jpeg, image/png, image/webp, application/pdf]
                byte_size: { type: integer, minimum: 1 }
      responses:
        '201':
          description: Upload slot.
          content:
            application/json:
              schema:
                type: object
                required: [storage_key, upload_url, expires_at]
                properties:
                  storage_key: { type: string }
                  upload_url: { type: string, format: uri, description: Pre-signed PUT URL. }
                  expires_at: { type: string, format: date-time }
                  headers:
                    type: object
                    additionalProperties: { type: string }
                    description: Headers the client must send with the PUT.
        '413':
          description: Too large.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ------------------------------------------------------------------ Locations
  /locations:
    get:
      tags: [Locations]
      operationId: listLocations
      summary: Children of a location, or top-level regions
      security: []
      parameters:
        - name: parent
          in: query
          description: PSGC code of the parent. Omit for regions.
          schema: { $ref: '#/components/schemas/PsgcCode' }
        - name: level
          in: query
          schema: { $ref: '#/components/schemas/LocationLevel' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK. Cache-Control public, max-age 86400. Supports ETag.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Location' }
                  next_cursor: { type: [string, 'null'] }

  /locations/search:
    get:
      tags: [Locations]
      operationId: searchLocations
      summary: Search municipalities and barangays by name
      security: []
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 60 }
        - name: level
          in: query
          schema: { $ref: '#/components/schemas/LocationLevel' }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Best matches, each with its ancestor names for display.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/LocationWithPath' }

  /locations/nearest:
    get:
      tags: [Locations]
      operationId: nearestBarangay
      summary: Barangay for a GPS fix
      security: []
      description: Used at farm registration to pre-fill the location. The farmer confirms it.
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number, minimum: 4, maximum: 22 }
        - name: lng
          in: query
          required: true
          schema: { type: number, minimum: 116, maximum: 127 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocationWithPath' }
        '404': { $ref: '#/components/responses/NotFound' }

  /locations/{psgc_code}:
    get:
      tags: [Locations]
      operationId: getLocation
      summary: One location with its ancestors
      security: []
      parameters:
        - $ref: '#/components/parameters/PsgcPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocationWithPath' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------------ Farms
  /farms:
    get:
      tags: [Farms]
      operationId: listMyFarms
      summary: Farms I own
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Farm' }
    post:
      tags: [Farms]
      operationId: createFarm
      summary: Register a farm
      description: Requires the farmer role. Verification is not required to keep records, only to list stock (Phase 2).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FarmInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Farm' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /farms/{farm_id}:
    parameters:
      - $ref: '#/components/parameters/FarmId'
    get:
      tags: [Farms]
      operationId: getFarm
      summary: One farm with lot summary
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Farm' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Farms]
      operationId: updateFarm
      summary: Update a farm
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FarmInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Farm' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      tags: [Farms]
      operationId: deleteFarm
      summary: Archive a farm
      description: Soft delete. Refused with 409 if the farm has an active listing (Phase 2).
      responses:
        '204': { description: Archived }
        '409':
          description: Farm has active listings.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ------------------------------------------------------------------ Lots
  /farms/{farm_id}/lots:
    parameters:
      - $ref: '#/components/parameters/FarmId'
    get:
      tags: [Lots]
      operationId: listLots
      summary: Lots on a farm
      parameters:
        - name: species
          in: query
          schema: { $ref: '#/components/schemas/Species' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Lot' }
    post:
      tags: [Lots]
      operationId: createLot
      summary: Add a lot
      description: |
        `weight_class_id` is derived server-side from species and `avg_weight_kg`
        unless the client sends one explicitly. The response always includes it.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LotInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lot' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /lots/{lot_id}:
    parameters:
      - $ref: '#/components/parameters/LotId'
    get:
      tags: [Lots]
      operationId: getLot
      summary: One lot with vaccinations and the board price for its class
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Lot'
                  - type: object
                    properties:
                      vaccinations:
                        type: array
                        items: { $ref: '#/components/schemas/Vaccination' }
                      board_price:
                        $ref: '#/components/schemas/RunningPrice'
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Lots]
      operationId: updateLot
      summary: Update head count, weight, notes
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LotInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lot' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      tags: [Lots]
      operationId: deleteLot
      summary: Remove a lot
      responses:
        '204': { description: Removed }
        '409':
          description: Lot has an active listing.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /lots/{lot_id}/vaccinations:
    parameters:
      - $ref: '#/components/parameters/LotId'
    post:
      tags: [Lots]
      operationId: addVaccination
      summary: Record a vaccination
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VaccinationInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vaccination' }

  /weight-classes:
    get:
      tags: [Lots]
      operationId: listWeightClasses
      summary: Weight bands per species
      security: []
      parameters:
        - name: species
          in: query
          schema: { $ref: '#/components/schemas/Species' }
      responses:
        '200':
          description: OK. Cache-Control public, max-age 86400.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/WeightClass' }

  # ------------------------------------------------------------------ Prices
  /prices/board:
    get:
      tags: [Prices]
      operationId: getBoard
      summary: Today's running prices for one municipality
      security: []
      description: |
        The main price board screen. One row per species and weight class, each
        resolved through the fallback ladder (municipality, province, reference).
        Backed by `running_price()` over the snapshot table. Never reads raw deals.
        Cache-Control public, max-age 300, with ETag so an offline client can revalidate cheaply.
      parameters:
        - name: municipality_code
          in: query
          required: true
          schema: { $ref: '#/components/schemas/PsgcCode' }
        - name: species
          in: query
          schema: { $ref: '#/components/schemas/Species' }
        - name: as_of
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: OK
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [municipality, province, as_of, items]
                properties:
                  municipality: { $ref: '#/components/schemas/Location' }
                  province: { $ref: '#/components/schemas/Location' }
                  as_of: { type: string, format: date }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/BoardRow' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /prices/running:
    get:
      tags: [Prices]
      operationId: getRunningPrice
      summary: One running price for a species and weight class
      security: []
      parameters:
        - name: municipality_code
          in: query
          required: true
          schema: { $ref: '#/components/schemas/PsgcCode' }
        - name: species
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Species' }
        - name: weight_class_id
          in: query
          schema: { type: integer }
        - name: as_of
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunningPrice' }
        '404': { $ref: '#/components/responses/NotFound' }

  /prices/history:
    get:
      tags: [Prices]
      operationId: getPriceHistory
      summary: Daily snapshots for a sparkline
      security: []
      parameters:
        - name: location_code
          in: query
          required: true
          description: Municipality or province PSGC code.
          schema: { $ref: '#/components/schemas/PsgcCode' }
        - name: species
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Species' }
        - name: weight_class_id
          in: query
          schema: { type: integer }
        - name: days
          in: query
          schema: { type: integer, minimum: 7, maximum: 365, default: 30 }
      responses:
        '200':
          description: One point per day where a snapshot exists. Gaps are not filled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  unit: { $ref: '#/components/schemas/PriceUnit' }
                  points:
                    type: array
                    items:
                      type: object
                      required: [date, median_price, sample_count]
                      properties:
                        date: { type: string, format: date }
                        median_price: { $ref: '#/components/schemas/Money' }
                        low_price: { $ref: '#/components/schemas/MoneyNullable' }
                        high_price: { $ref: '#/components/schemas/MoneyNullable' }
                        sample_count: { type: integer }

  # ------------------------------------------------------------------ Marketplace
  /listings:
    get:
      tags: [Marketplace]
      operationId: listListings
      summary: Open listings for buyers, nearest and newest first
      parameters:
        - name: species
          in: query
          schema: { $ref: '#/components/schemas/Species' }
        - name: weight_class_id
          in: query
          schema: { type: integer }
        - name: province_code
          in: query
          schema: { $ref: '#/components/schemas/PsgcCode' }
        - name: municipality_code
          in: query
          schema: { $ref: '#/components/schemas/PsgcCode' }
        - name: verified_only
          in: query
          schema: { type: boolean, default: false }
        - name: mine
          in: query
          description: Farmer view, my own listings in any status.
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Listing' }
                  next_cursor: { type: [string, 'null'] }
    post:
      tags: [Marketplace]
      operationId: createListing
      summary: Post a lot for sale
      description: Farmer role, verified account. Unit comes from the lot's weight class. The board price at listing time is stored for analysis.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListingInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Listing' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /listings/{listing_id}:
    parameters:
      - name: listing_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Marketplace]
      operationId: getListing
      summary: One listing with its lot and farm location
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Listing' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Marketplace]
      operationId: withdrawListing
      summary: Withdraw a listing
      description: Pending offers are rejected. Refused with 409 once a deal exists.
      responses:
        '204': { description: Withdrawn. }
        '409':
          description: Listing already matched.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /listings/{listing_id}/offers:
    parameters:
      - name: listing_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Marketplace]
      operationId: listOffers
      summary: Offers on a listing
      description: The farmer sees every offer; a buyer sees only their own chain.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Offer' }
    post:
      tags: [Marketplace]
      operationId: makeOffer
      summary: Make an offer
      description: Buyer role, verified account. One pending offer per buyer per listing; a new one replaces it. Expires in 24 hours unless the farmer answers.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OfferInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Offer' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Listing is not open.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /offers/{offer_id}/counter:
    post:
      tags: [Marketplace]
      operationId: counterOffer
      summary: Counter an offer
      description: The other party proposes a new price or head count. The original becomes countered; the counter is a new pending offer linked by parent_offer_id.
      parameters:
        - name: offer_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [price, heads]
              properties:
                price: { $ref: '#/components/schemas/Money' }
                heads: { type: integer, minimum: 1 }
                note: { type: [string, 'null'], maxLength: 300 }
      responses:
        '201':
          description: Counter created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Offer' }
        '409':
          description: Offer is no longer pending.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /offers/{offer_id}/accept:
    post:
      tags: [Marketplace]
      operationId: acceptOffer
      summary: Accept an offer, creating the deal
      description: The party who did not make the offer accepts it. The listing becomes matched and other pending offers are rejected.
      parameters:
        - name: offer_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Deal created in state accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deal' }
        '409':
          description: Offer is no longer pending or has expired.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /offers/{offer_id}/reject:
    post:
      tags: [Marketplace]
      operationId: rejectOffer
      summary: Reject an offer, or withdraw your own
      parameters:
        - name: offer_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: [string, 'null'], maxLength: 300 }
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Offer' }
  /deals:
    get:
      tags: [Marketplace]
      operationId: listMyDeals
      summary: My deals as farmer or buyer
      parameters:
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/DealState' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Deal' }
                  next_cursor: { type: [string, 'null'] }
  /deals/{deal_id}:
    get:
      tags: [Marketplace]
      operationId: getDeal
      summary: One deal with its event timeline
      parameters:
        - name: deal_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deal' }
        '404': { $ref: '#/components/responses/NotFound' }
  /deals/{deal_id}/deliver:
    post:
      tags: [Marketplace]
      operationId: confirmDelivery
      summary: Buyer confirms receipt with head count and weighed total
      description: Allowed from accepted (buyer brings own truck) or in_transit. The recomputed total uses the weighed kilograms.
      parameters:
        - name: deal_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [delivered_heads]
              properties:
                delivered_heads: { type: integer, minimum: 0 }
                delivered_weight_kg: { $ref: '#/components/schemas/Weight' }
                note: { type: [string, 'null'], maxLength: 500 }
                photo_keys:
                  type: array
                  maxItems: 5
                  items: { type: string }
      responses:
        '200':
          description: Delivered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deal' }
        '409':
          description: Not in a state that can be delivered.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /deals/{deal_id}/pay:
    post:
      tags: [Marketplace]
      operationId: recordPayment
      summary: Buyer records the off-platform payment
      parameters:
        - name: deal_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              properties:
                method: { type: string, enum: [gcash, bank, cash] }
                reference: { type: [string, 'null'], maxLength: 80 }
      responses:
        '200':
          description: Recorded; waiting for the farmer to confirm.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deal' }
  /deals/{deal_id}/confirm-payment:
    post:
      tags: [Marketplace]
      operationId: confirmPayment
      summary: Farmer confirms the money arrived; the deal settles
      description: Settling writes the price into the board (unless flagged as an outlier) and refreshes today's snapshots.
      parameters:
        - name: deal_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Settled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deal' }
        '409':
          description: Buyer has not recorded a payment, or the deal is not delivered.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /deals/{deal_id}/cancel:
    post:
      tags: [Marketplace]
      operationId: cancelDeal
      summary: Cancel before delivery
      description: Either party, from accepted or hauler_assigned. The listing reopens.
      parameters:
        - name: deal_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 300 }
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deal' }
  /deals/{deal_id}/dispute:
    post:
      tags: [Marketplace]
      operationId: openDispute
      summary: Open a dispute after delivery
      description: Freezes the deal; its price does not enter the board until an admin resolves it.
      parameters:
        - name: deal_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, enum: [weight_mismatch, health, non_payment, no_show, other] }
                details: { type: [string, 'null'], maxLength: 1000 }
      responses:
        '201':
          description: Dispute opened
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dispute' }
  /deals/{deal_id}/ratings:
    post:
      tags: [Marketplace]
      operationId: rateCounterparty
      summary: Rate the other party after settlement
      parameters:
        - name: deal_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [score]
              properties:
                score: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: [string, 'null'], maxLength: 300 }
      responses:
        '201': { description: Rated. }
        '409':
          description: Deal not settled, or already rated.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /admin/disputes:
    get:
      tags: [Admin]
      operationId: adminListDisputes
      summary: Disputes, open first
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [open, under_review, resolved_settled, resolved_refunded, dismissed] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Dispute' }
  /admin/disputes/{dispute_id}/resolve:
    post:
      tags: [Admin]
      operationId: adminResolveDispute
      summary: Resolve a dispute
      description: settled keeps the deal and lets its price join the board (optionally at a corrected weight); refunded excludes it; dismissed returns the deal to delivered.
      parameters:
        - name: dispute_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome, resolution]
              properties:
                outcome: { type: string, enum: [settled, refunded, dismissed] }
                resolution: { type: string, minLength: 3, maxLength: 1000 }
                delivered_weight_kg: { $ref: '#/components/schemas/Weight' }
                deposit:
                  type: string
                  enum: [release_to_farmer, refund_to_buyer, hold]
                  description: Where a paid deposit goes. Defaults follow the outcome (settled releases, refunded refunds, dismissed holds).
      responses:
        '200':
          description: Resolved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dispute' }
  /admin/deals:
    get:
      tags: [Admin]
      operationId: adminListDeals
      summary: Deals across all users, newest first
      parameters:
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/DealState' }
        - name: species
          in: query
          schema: { $ref: '#/components/schemas/Species' }
        - name: province_code
          in: query
          schema: { $ref: '#/components/schemas/PsgcCode' }
        - name: outliers_only
          in: query
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Deal' }
                  next_cursor: { type: [string, 'null'] }
  /admin/deals/{deal_id}/outlier-review:
    post:
      tags: [Admin]
      operationId: adminReviewOutlier
      summary: Let a flagged settlement count, or keep it out
      parameters:
        - name: deal_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [counts_for_price]
              properties:
                counts_for_price: { type: boolean }
                note: { type: [string, 'null'], maxLength: 500 }
      responses:
        '200':
          description: Reviewed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deal' }
  # ------------------------------------------------------------------ Logistics
  /haulers/me:
    get:
      tags: [Logistics]
      operationId: getMyHaulerProfile
      summary: My truck and rates
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HaulerProfile' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Logistics]
      operationId: putMyHaulerProfile
      summary: Create or replace my truck and rates
      description: Hauler role. Verification is separate and needs the OR/CR and ID documents.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HaulerProfileInput' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HaulerProfile' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /haul-jobs:
    get:
      tags: [Logistics]
      operationId: listHaulJobs
      summary: Accepted deals that need a hauler, soonest pickup first
      description: Hauler role. Jobs inside an active restricted zone for the species are excluded. fits_my_truck filters by capacity_heads.
      parameters:
        - name: species
          in: query
          schema: { $ref: '#/components/schemas/Species' }
        - name: province_code
          in: query
          schema: { $ref: '#/components/schemas/PsgcCode' }
        - name: fits_my_truck
          in: query
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/HaulJob' }
  /haul-jobs/{deal_id}/accept:
    post:
      tags: [Logistics]
      operationId: acceptHaulJob
      summary: Take a job
      description: Verified hauler with a profile. Refused with 409 when the job is gone, over the truck's capacity, or inside a restricted zone. The deal moves to hauler_assigned.
      parameters:
        - name: deal_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agreed_fee, scheduled_pickup_at]
              properties:
                agreed_fee: { $ref: '#/components/schemas/Money' }
                scheduled_pickup_at: { type: string, format: date-time }
      responses:
        '201':
          description: Shipment created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shipment' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Job unavailable, over capacity, or restricted.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /shipments:
    get:
      tags: [Logistics]
      operationId: listMyShipments
      summary: My shipments as hauler
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ShipmentStatus' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Shipment' }
  /shipments/{shipment_id}:
    get:
      tags: [Logistics]
      operationId: getShipment
      summary: One shipment with its events
      description: Visible to the hauler, the farmer, the buyer and admins.
      parameters:
        - name: shipment_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shipment' }
        '404': { $ref: '#/components/responses/NotFound' }
  /shipments/{shipment_id}/start:
    post:
      tags: [Logistics]
      operationId: startTrip
      summary: Pickup checklist complete, trip starts
      description: 'Every item is required: shipping permit number, veterinary health certificate number, head count, at least one load photo. The deal moves to in_transit.'
      parameters:
        - name: shipment_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shipping_permit_no, vet_health_cert_no, head_count, photo_keys]
              properties:
                shipping_permit_no: { type: string, minLength: 3, maxLength: 60 }
                vet_health_cert_no: { type: string, minLength: 3, maxLength: 60 }
                head_count: { type: integer, minimum: 1 }
                photo_keys:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items: { type: string }
                note: { type: [string, 'null'], maxLength: 300 }
                geo:
                  type: [object, 'null']
                  properties:
                    lat: { type: number }
                    lng: { type: number }
      responses:
        '200':
          description: In transit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shipment' }
        '409':
          description: Not assigned to you, or not in the assigned state.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /shipments/{shipment_id}/ping:
    post:
      tags: [Logistics]
      operationId: shipmentPing
      summary: Position update, checkpoint, delay or problem in transit
      parameters:
        - name: shipment_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [geo]
              properties:
                geo:
                  type: object
                  required: [lat, lng]
                  properties:
                    lat: { type: number }
                    lng: { type: number }
                kind: { type: string, enum: [position, checkpoint, delay, problem], default: position }
                note: { type: [string, 'null'], maxLength: 300 }
      responses:
        '201': { description: Recorded. }
  /shipments/{shipment_id}/delivered:
    post:
      tags: [Logistics]
      operationId: markDelivered
      summary: Hauler hands over to the buyer
      description: The shipment becomes delivered. The deal stays in_transit until the buyer confirms count and weight through POST /deals/{deal_id}/deliver.
      parameters:
        - name: shipment_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: [string, 'null'], maxLength: 300 }
                photo_keys:
                  type: array
                  maxItems: 5
                  items: { type: string }
                geo:
                  type: [object, 'null']
                  properties:
                    lat: { type: number }
                    lng: { type: number }
      responses:
        '200':
          description: Delivered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shipment' }
  /shipments/{shipment_id}/cancel:
    post:
      tags: [Logistics]
      operationId: cancelShipment
      summary: Hauler withdraws before pickup
      description: Allowed only while assigned. The deal returns to accepted and the job reappears on the board; the farmer and buyer are told.
      parameters:
        - name: shipment_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 300 }
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shipment' }
  # ------------------------------------------------------------------ Payments
  /deals/{deal_id}/deposit:
    get:
      tags: [Payments]
      operationId: getDeposit
      summary: The booking deposit on a deal
      description: Farmer, buyer and admins. checkout_url is returned to the buyer only, while the deposit is pending.
      parameters:
        - name: deal_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deposit' }
        '404': { $ref: '#/components/responses/NotFound' }
  /deals/{deal_id}/deposit/checkout:
    post:
      tags: [Payments]
      operationId: refreshDepositCheckout
      summary: Buyer asks for a fresh checkout link
      description: Used when the first link could not be created or was closed. Same amount, same deadline.
      parameters:
        - name: deal_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deposit' }
        '409':
          description: Deposit is not pending.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /me/payout-account:
    get:
      tags: [Payments]
      operationId: getMyPayoutAccount
      summary: Where I get paid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutAccount' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Payments]
      operationId: putMyPayoutAccount
      summary: Set my GCash number or bank account
      description: Farmer role. A one-peso test transfer verifies the account; released deposits go here.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayoutAccountInput' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutAccount' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /payments/webhook:
    post:
      tags: [Payments]
      operationId: paymentsWebhook
      summary: Provider callbacks (checkout paid, transfer succeeded or failed)
      description: Unauthenticated; the body is verified with the provider's signature header. Events are stored once by id and replays return 200 without side effects.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: Recorded. }
        '400': { description: Bad signature or malformed event. }
  /admin/deposits:
    get:
      tags: [Payments]
      operationId: adminListDeposits
      summary: Deposits, newest first
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/DepositStatus' }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, totals]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Deposit' }
                  totals: { $ref: '#/components/schemas/DepositTotals' }
  # ------------------------------------------------------------------ Sync
  /sync:
    post:
      tags: [Sync]
      operationId: syncBatch
      summary: Apply a queue of offline mutations
      description: |
        The mobile app records farm and lot edits offline and replays them here in
        order. Each operation has its own idempotency key and, for updates, the
        `version` the client last saw. The server applies what it can and returns a
        per-operation result; a conflict returns the server copy so the app can show
        a merge screen instead of silently overwriting. Max 200 operations per call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operations]
              properties:
                operations:
                  type: array
                  maxItems: 200
                  items: { $ref: '#/components/schemas/SyncOperation' }
      responses:
        '200':
          description: Per-operation outcomes, same order as the request.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/SyncResult' }

  # ------------------------------------------------------------------ Admin
  /admin/verification-queue:
    get:
      tags: [Admin]
      operationId: adminVerificationQueue
      summary: Users with pending documents, oldest first
      parameters:
        - name: role
          in: query
          schema: { $ref: '#/components/schemas/Role' }
        - name: province_code
          in: query
          schema: { $ref: '#/components/schemas/PsgcCode' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/VerificationCase' }
                  next_cursor: { type: [string, 'null'] }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/users/{user_id}:
    get:
      tags: [Admin]
      operationId: adminGetUser
      summary: User detail with documents, farms and audit history
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationCase' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/users/{user_id}/verification:
    post:
      tags: [Admin]
      operationId: adminSetVerification
      summary: Verify, reject or suspend a user
      description: Writes an `admin_audit_log` row with before and after. Sends the user an SMS on any change.
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [verified, rejected, suspended]
                notes: { type: string, maxLength: 1000, description: Shown to the user when rejected. }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/documents/{document_id}/review:
    post:
      tags: [Admin]
      operationId: adminReviewDocument
      summary: Accept or reject one document
      parameters:
        - name: document_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [verified, rejected] }
                notes: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDocument' }

  /admin/documents/{document_id}/file:
    get:
      tags: [Admin]
      operationId: adminGetDocumentFile
      summary: Short-lived signed URL to view a document
      description: URL expires in 5 minutes. Access is logged.
      parameters:
        - name: document_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, format: uri }
                  expires_at: { type: string, format: date-time }

  /admin/reference-prices:
    get:
      tags: [Admin]
      operationId: adminListReferencePrices
      summary: Current reference price per province, species and class
      parameters:
        - name: province_code
          in: query
          schema: { $ref: '#/components/schemas/PsgcCode' }
        - name: species
          in: query
          schema: { $ref: '#/components/schemas/Species' }
        - name: include_history
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ReferencePrice' }
    post:
      tags: [Admin]
      operationId: adminSetReferencePrice
      summary: Set a reference price
      description: |
        Inserts a new row; history is never overwritten. `effective_from` may not be
        earlier than 7 days ago. A price more than 30 percent from the previous row
        for the same key is accepted but flagged `large_change: true` in the response
        and in the audit log, so a typo is caught by the second admin.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReferencePriceInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferencePrice' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /admin/reference-prices/import:
    post:
      tags: [Admin]
      operationId: adminImportReferencePrices
      summary: Bulk import from a CSV (PSA farmgate series)
      description: |
        CSV columns: province_code, species, weight_class_label (optional), unit, price,
        effective_from, source. Validated as a whole; any bad row rejects the file with
        line numbers. Nothing is written on a partial failure.
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string }
      responses:
        '201':
          description: Imported
          content:
            application/json:
              schema:
                type: object
                properties:
                  inserted: { type: integer }
                  large_changes:
                    type: array
                    items: { $ref: '#/components/schemas/ReferencePrice' }
        '422':
          description: Validation errors with line numbers.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /admin/restricted-zones:
    get:
      tags: [Admin]
      operationId: adminListRestrictedZones
      summary: Active and scheduled movement restrictions
      parameters:
        - name: active_on
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RestrictedZone' }
    post:
      tags: [Admin]
      operationId: adminCreateRestrictedZone
      summary: Mark a location restricted for a species
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RestrictedZoneInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestrictedZone' }

  /admin/restricted-zones/{zone_id}:
    patch:
      tags: [Admin]
      operationId: adminEndRestrictedZone
      summary: Set or change the end date
      parameters:
        - name: zone_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ends_on]
              properties:
                ends_on: { type: string, format: date }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestrictedZone' }

  /admin/price-snapshots/refresh:
    post:
      tags: [Admin]
      operationId: adminRefreshSnapshots
      summary: Run the snapshot job for a date now
      description: Calls `refresh_price_snapshots(date)`. Normally the nightly scheduler does this. Audited.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                date: { type: string, format: date }
                window_days: { type: integer, default: 7 }
      responses:
        '200':
          description: Rows written.
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows: { type: integer }

  /admin/audit-log:
    get:
      tags: [Admin]
      operationId: adminAuditLog
      summary: Admin actions, newest first
      parameters:
        - name: admin_id
          in: query
          schema: { type: string, format: uuid }
        - name: action
          in: query
          schema: { type: string }
        - name: target_id
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AuditEntry' }
                  next_cursor: { type: [string, 'null'] }

  /admin/users:
    get:
      tags: [Admin]
      operationId: adminListUsers
      summary: Everyone, filterable
      parameters:
        - name: role
          in: query
          schema: { $ref: '#/components/schemas/Role' }
        - name: verification
          in: query
          schema: { $ref: '#/components/schemas/VerificationStatus' }
        - name: q
          in: query
          description: Name or phone fragment.
          schema: { type: string, maxLength: 60 }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AdminUserRow' }
                  next_cursor: { type: [string, 'null'] }
  /admin/reports/summary:
    get:
      tags: [Admin]
      operationId: adminReportSummary
      summary: Health of the whole system for a period
      description: Volume and price by species, users by role, time to settle, dispute rate, deposit outcomes, hauled share, and municipalities with listings but too few settled deals for a live median.
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
          description: Default 30 days ago.
        - name: to
          in: query
          schema: { type: string, format: date }
          description: Default today.
        - name: province_code
          in: query
          schema: { $ref: '#/components/schemas/PsgcCode' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportSummary' }
  /admin/reports/deals.csv:
    get:
      tags: [Admin]
      operationId: adminReportDealsCsv
      summary: Settled and other deals in the period as CSV
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: province_code
          in: query
          schema: { $ref: '#/components/schemas/PsgcCode' }
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/DealState' }
      responses:
        '200':
          description: One row per deal.
          content:
            text/csv:
              schema: { type: string }
  # ------------------------------------------------------------------ Admin auth
  /admin/auth/login:
    post:
      tags: [Admin auth]
      operationId: adminLogin
      summary: Step one, email and password
      security: []
      description: |
        Returns a short-lived step token for the authenticator step. The response is the same
        whether the email exists or not, unless the account is locked (423). On the very first
        sign-in the response also carries the authenticator secret to enrol; the first valid
        code confirms it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 12, maxLength: 200 }
      responses:
        '200':
          description: Password accepted, authenticator code required.
          content:
            application/json:
              schema:
                type: object
                required: [step_token, expires_in_seconds]
                properties:
                  step_token: { type: string, description: Send with the code within 5 minutes. }
                  expires_in_seconds: { type: integer, example: 300 }
                  totp_setup:
                    type: [object, 'null']
                    description: Present only when no authenticator is enrolled yet.
                    properties:
                      secret: { type: string, description: 'Base32, to type into the app if the QR cannot be scanned.' }
                      otpauth_url: { type: string, format: uri }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '423':
          description: Account locked after repeated failures. Retry-After is set.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /admin/auth/totp:
    post:
      tags: [Admin auth]
      operationId: adminTotp
      summary: Step two, authenticator code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [step_token, code]
              properties:
                step_token: { type: string }
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '423':
          description: Account locked after repeated failures.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /admin/auth/password:
    post:
      tags: [Admin auth]
      operationId: adminChangePassword
      summary: Change my console password
      description: Requires the admin role and the current password. Revokes every other session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 12, maxLength: 200 }
      responses:
        '204': { description: Changed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  # ------------------------------------------------------------------ Ops
  /health:
    get:
      tags: [Ops]
      operationId: health
      summary: Liveness and dependency check
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok, degraded] }
                  db: { type: string }
                  redis: { type: string }
                  last_snapshot_date: { type: [string, 'null'], format: date }

# ====================================================================== Components
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token, 15 minute lifetime. Claims: `sub` (user id), `roles` (array),
        `ver` (verification status), `jti`. Role checks happen server-side on every
        request; the client uses the claims only to choose which screens to show.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated UUID. Stored 48 hours.
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The `version` of the record the client last saw.
      schema: { type: integer, minimum: 1 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    PsgcPath:
      name: psgc_code
      in: path
      required: true
      schema: { $ref: '#/components/schemas/PsgcCode' }
    FarmId:
      name: farm_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    LotId:
      name: lot_id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing or invalid token.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Role or ownership check failed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Not found, or not visible to this user.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unprocessable:
      description: Validation failed. `errors` lists field problems.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: Too many requests. `Retry-After` header is set.
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreconditionRequired:
      description: If-Match header missing.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    VersionConflict:
      description: The record changed since the client last saw it. Body carries the current server copy under `current`.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  current: { type: object }

  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri, example: 'https://api.example.ph/problems/validation' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

    PhoneE164:
      type: string
      pattern: '^\+63[0-9]{10}$'
      example: '+639171234567'
    PsgcCode:
      type: string
      pattern: '^[0-9]{9,10}$'
      description: Philippine Standard Geographic Code.
      example: '0304924000'
    LangCode:
      type: string
      enum: [fil, en, ceb, ilo, hil, bcl, war]
      description: Filipino, English, Cebuano, Ilocano, Hiligaynon, Bikol, Waray.
    Money:
      type: string
      pattern: '^[0-9]+\.[0-9]{2}$'
      description: Philippine pesos as a decimal string.
      example: '185.50'
    MoneyNullable:
      type: [string, 'null']
      pattern: '^[0-9]+\.[0-9]{2}$'
    Weight:
      type: string
      pattern: '^[0-9]+(\.[0-9]{1,2})?$'
      description: Kilograms as a decimal string.
      example: '92.5'
    Role:
      type: string
      enum: [farmer, buyer, hauler, admin]
    VerificationStatus:
      type: string
      enum: [pending, verified, rejected, suspended]
    Species:
      type: string
      enum: [hog, cattle, carabao, goat, native_chicken]
    PriceUnit:
      type: string
      enum: [per_kg_liveweight, per_head]
    PriceSource:
      type: string
      enum: [municipality, province, reference]
      description: Which rung of the fallback ladder produced the price.
    LocationLevel:
      type: string
      enum: [region, province, municipality, barangay]
    DocType:
      type: string
      enum: [gov_id, selfie_with_id, business_permit, ltfrb_franchise, or_cr, coop_membership, barangay_clearance]

    TokenPair:
      type: object
      required: [access_token, refresh_token, expires_in_seconds, user]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in_seconds: { type: integer, example: 900 }
        user: { $ref: '#/components/schemas/User' }

    DeviceInfo:
      type: object
      required: [device_id, platform]
      properties:
        device_id: { type: string, description: Stable per-install id generated by the app. }
        platform: { type: string, enum: [android, ios, web] }
        push_token: { type: string }
        app_version: { type: string }

    User:
      type: object
      required: [id, phone_masked, full_name, preferred_lang, roles, verification, created_at]
      properties:
        id: { type: string, format: uuid }
        phone_masked: { type: string, example: '+63917*****67' }
        full_name: { type: string }
        preferred_lang: { $ref: '#/components/schemas/LangCode' }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
        verification: { $ref: '#/components/schemas/VerificationStatus' }
        verified_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }

    UserDocument:
      type: object
      required: [id, doc_type, status, uploaded_at]
      properties:
        id: { type: string, format: uuid }
        doc_type: { $ref: '#/components/schemas/DocType' }
        status: { $ref: '#/components/schemas/VerificationStatus' }
        notes: { type: [string, 'null'], description: 'Reviewer note, shown to the user when rejected.' }
        uploaded_at: { type: string, format: date-time }
        reviewed_at: { type: [string, 'null'], format: date-time }

    Location:
      type: object
      required: [psgc_code, level, name]
      properties:
        psgc_code: { $ref: '#/components/schemas/PsgcCode' }
        parent_code: { type: [string, 'null'] }
        level: { $ref: '#/components/schemas/LocationLevel' }
        name: { type: string }
        centroid:
          type: [object, 'null']
          properties:
            lat: { type: number }
            lng: { type: number }
        has_children: { type: boolean }

    LocationWithPath:
      allOf:
        - $ref: '#/components/schemas/Location'
        - type: object
          required: [path]
          properties:
            path:
              type: array
              description: Ancestors from region down to this location's parent.
              items: { $ref: '#/components/schemas/Location' }
            display_name:
              type: string
              example: 'Talavera, Nueva Ecija'

    WeightClass:
      type: object
      required: [id, species, label, unit, sort]
      properties:
        id: { type: integer }
        species: { $ref: '#/components/schemas/Species' }
        label: { type: string, example: '80-100 kg' }
        min_kg: { type: [string, 'null'] }
        max_kg: { type: [string, 'null'] }
        unit: { $ref: '#/components/schemas/PriceUnit' }
        sort: { type: integer }

    FarmInput:
      type: object
      required: [name, barangay_code]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        barangay_code: { $ref: '#/components/schemas/PsgcCode' }
        address_line: { type: [string, 'null'], maxLength: 200 }
        geo:
          type: [object, 'null']
          required: [lat, lng]
          properties:
            lat: { type: number }
            lng: { type: number }
        farm_type: { type: [string, 'null'], enum: [backyard, commercial, cooperative, null] }
        permit_ref: { type: [string, 'null'], maxLength: 80 }
        photo_keys:
          type: array
          maxItems: 5
          items: { type: string }

    Farm:
      allOf:
        - $ref: '#/components/schemas/FarmInput'
        - type: object
          required: [id, owner_id, version, location, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            owner_id: { type: string, format: uuid }
            version: { type: integer, description: Increments on every write. Send back in If-Match. }
            location: { $ref: '#/components/schemas/LocationWithPath' }
            lot_summary:
              type: array
              items:
                type: object
                properties:
                  species: { $ref: '#/components/schemas/Species' }
                  lots: { type: integer }
                  heads: { type: integer }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }

    LotInput:
      type: object
      required: [species, head_count]
      properties:
        species: { $ref: '#/components/schemas/Species' }
        breed: { type: [string, 'null'], maxLength: 60 }
        head_count: { type: integer, minimum: 1, maximum: 100000 }
        avg_weight_kg: { $ref: '#/components/schemas/Weight' }
        weight_class_id: { type: [integer, 'null'], description: Optional override; derived from avg_weight_kg when omitted. }
        age_months: { type: [integer, 'null'], minimum: 0, maximum: 300 }
        sex: { type: [string, 'null'], enum: [male, female, mixed, null] }
        notes: { type: [string, 'null'], maxLength: 500 }
        photo_keys:
          type: array
          maxItems: 5
          items: { type: string }

    Lot:
      allOf:
        - $ref: '#/components/schemas/LotInput'
        - type: object
          required: [id, farm_id, version, weight_class, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            farm_id: { type: string, format: uuid }
            version: { type: integer }
            weight_class: { $ref: '#/components/schemas/WeightClass' }
            last_vaccination_on: { type: [string, 'null'], format: date }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }

    VaccinationInput:
      type: object
      required: [vaccine, given_on]
      properties:
        vaccine: { type: string, maxLength: 80 }
        given_on: { type: string, format: date }
        given_by: { type: [string, 'null'], maxLength: 120 }
        doc_key: { type: [string, 'null'] }

    Vaccination:
      allOf:
        - $ref: '#/components/schemas/VaccinationInput'
        - type: object
          required: [id, lot_id, created_at]
          properties:
            id: { type: string, format: uuid }
            lot_id: { type: string, format: uuid }
            created_at: { type: string, format: date-time }

    RunningPrice:
      type: object
      description: |
        Output of `running_price()`. `source` says which rung answered. `municipality`
        is always present so the UI can grey out a thin local figure next to the
        figure actually used.
      required: [species, unit, source, location_code, location_name, median_price, sample_count, as_of, municipality]
      properties:
        species: { $ref: '#/components/schemas/Species' }
        weight_class: { $ref: '#/components/schemas/WeightClass' }
        unit: { $ref: '#/components/schemas/PriceUnit' }
        source: { $ref: '#/components/schemas/PriceSource' }
        location_code: { $ref: '#/components/schemas/PsgcCode' }
        location_name: { type: string, example: 'Nueva Ecija' }
        median_price: { $ref: '#/components/schemas/MoneyNullable' }
        low_price: { $ref: '#/components/schemas/MoneyNullable' }
        high_price: { $ref: '#/components/schemas/MoneyNullable' }
        sample_count: { type: integer, description: 0 when source is reference. }
        change_30d_pct: { type: [number, 'null'] }
        window_days: { type: integer, example: 7 }
        as_of: { type: string, format: date }
        reference_source: { type: [string, 'null'], description: 'Set when source is reference, e.g. PSA farmgate, Aug 2026.' }
        municipality:
          type: object
          required: [sample_count]
          properties:
            median_price: { $ref: '#/components/schemas/MoneyNullable' }
            sample_count: { type: integer }
        label:
          type: object
          description: Pre-rendered display strings in the user's language so every client says the same thing.
          properties:
            fil: { type: string, example: 'Batay sa 12 bentahan sa Talavera ngayong linggo' }
            en: { type: string, example: 'Based on 12 sales in Talavera this week' }

    BoardRow:
      allOf:
        - $ref: '#/components/schemas/RunningPrice'
        - type: object
          properties:
            sparkline:
              type: array
              description: Last 14 daily medians at the level used, oldest first. Nulls for missing days.
              items: { type: [number, 'null'] }

    SyncOperation:
      type: object
      required: [op_id, method, path, body]
      properties:
        op_id: { type: string, format: uuid, description: Doubles as the idempotency key. }
        method: { type: string, enum: [POST, PATCH, DELETE] }
        path:
          type: string
          description: One of the farm, lot or vaccination paths above. Client-side temporary ids are allowed in the form `tmp:<uuid>` and are resolved from earlier operations in the same batch.
          example: '/farms/tmp:5a6f.../lots'
        if_match: { type: [integer, 'null'] }
        body: { type: object }
        recorded_at: { type: string, format: date-time, description: When the user made the edit on the device. }

    SyncResult:
      type: object
      required: [op_id, status]
      properties:
        op_id: { type: string, format: uuid }
        status: { type: integer, description: HTTP status the operation would have returned. }
        resource: { type: object, description: The created or updated record on 2xx. }
        id_map:
          type: object
          additionalProperties: { type: string, format: uuid }
          description: Temporary id to server id for creates.
        problem: { $ref: '#/components/schemas/Problem' }

    VerificationCase:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
        documents:
          type: array
          items: { $ref: '#/components/schemas/UserDocument' }
        farms:
          type: array
          items: { $ref: '#/components/schemas/Farm' }
        oldest_pending_at: { type: [string, 'null'], format: date-time }

    ReferencePriceInput:
      type: object
      required: [province_code, species, unit, price, source, effective_from]
      properties:
        province_code: { $ref: '#/components/schemas/PsgcCode' }
        species: { $ref: '#/components/schemas/Species' }
        weight_class_id: { type: [integer, 'null'], description: Null applies to all classes of the species that lack their own row. }
        unit: { $ref: '#/components/schemas/PriceUnit' }
        price: { $ref: '#/components/schemas/Money' }
        source: { type: string, maxLength: 200, example: 'PSA farmgate, week 35 2026' }
        effective_from: { type: string, format: date }

    ReferencePrice:
      allOf:
        - $ref: '#/components/schemas/ReferencePriceInput'
        - type: object
          required: [id, set_by, created_at]
          properties:
            id: { type: string, format: uuid }
            set_by: { type: string, format: uuid }
            created_at: { type: string, format: date-time }
            large_change: { type: boolean }
            previous_price: { $ref: '#/components/schemas/MoneyNullable' }

    RestrictedZoneInput:
      type: object
      required: [location_code, species, reason, starts_on]
      properties:
        location_code: { $ref: '#/components/schemas/PsgcCode' }
        species: { $ref: '#/components/schemas/Species' }
        reason: { type: string, maxLength: 200, example: 'ASF red zone, BAI memo 2026-41' }
        starts_on: { type: string, format: date }
        ends_on: { type: [string, 'null'], format: date }

    RestrictedZone:
      allOf:
        - $ref: '#/components/schemas/RestrictedZoneInput'
        - type: object
          required: [id, set_by, created_at, location]
          properties:
            id: { type: string, format: uuid }
            location: { $ref: '#/components/schemas/LocationWithPath' }
            set_by: { type: string, format: uuid }
            created_at: { type: string, format: date-time }

    AuditEntry:
      type: object
      required: [id, admin_id, action, target_type, target_id, created_at]
      properties:
        id: { type: integer }
        admin_id: { type: string, format: uuid }
        admin_name: { type: string }
        action: { type: string, example: set_reference_price }
        target_type: { type: string }
        target_id: { type: string }
        before: { type: [object, 'null'] }
        after: { type: [object, 'null'] }
        created_at: { type: string, format: date-time }
    DealState:
      type: string
      enum: [accepted, hauler_assigned, in_transit, delivered, settled, cancelled, disputed, refunded]
    ListingInput:
      type: object
      required: [lot_id, heads_offered, asking_price]
      properties:
        lot_id: { type: string, format: uuid }
        heads_offered: { type: integer, minimum: 1 }
        asking_price: { $ref: '#/components/schemas/Money' }
        available_from: { type: string, format: date }
        pickup_window_end: { type: [string, 'null'], format: date }
    Listing:
      allOf:
        - $ref: '#/components/schemas/ListingInput'
        - type: object
          required: [id, farmer_id, status, species, weight_class, unit, head_count, created_at]
          properties:
            id: { type: string, format: uuid }
            farmer_id: { type: string, format: uuid }
            farmer_name: { type: string }
            farmer_verified: { type: boolean }
            farm_name: { type: string }
            status: { type: string, enum: [active, matched, withdrawn, expired] }
            species: { $ref: '#/components/schemas/Species' }
            weight_class: { $ref: '#/components/schemas/WeightClass' }
            unit: { $ref: '#/components/schemas/PriceUnit' }
            head_count: { type: integer, description: Heads in the lot. }
            avg_weight_kg: { $ref: '#/components/schemas/MoneyNullable' }
            last_vaccination_on: { type: [string, 'null'], format: date }
            location: { $ref: '#/components/schemas/LocationWithPath' }
            board_price: { $ref: '#/components/schemas/MoneyNullable' }
            board_source: { type: [string, 'null'] }
            vs_board_pct: { type: [number, 'null'], description: 'Asking price relative to the board, in percent.' }
            estimated_total: { $ref: '#/components/schemas/MoneyNullable' }
            pending_offers: { type: integer }
            created_at: { type: string, format: date-time }
    OfferInput:
      type: object
      required: [price, heads]
      properties:
        price: { $ref: '#/components/schemas/Money' }
        heads: { type: integer, minimum: 1 }
        pickup_on: { type: [string, 'null'], format: date }
        needs_hauler: { type: boolean, default: true, description: 'Book a hauler in the app, or bring my own truck.' }
        dropoff_location_code:
          allOf: [{ $ref: '#/components/schemas/PsgcCode' }]
          description: Municipality or barangay where the buyer wants delivery. Haulers see it on the job board.
        note: { type: [string, 'null'], maxLength: 300 }
    Offer:
      allOf:
        - $ref: '#/components/schemas/OfferInput'
        - type: object
          required: [id, listing_id, buyer_id, offered_by, status, expires_at, created_at]
          properties:
            id: { type: string, format: uuid }
            listing_id: { type: string, format: uuid }
            buyer_id: { type: string, format: uuid }
            buyer_name: { type: string }
            parent_offer_id: { type: [string, 'null'], format: uuid }
            offered_by: { type: string, enum: [farmer, buyer] }
            status: { type: string, enum: [pending, countered, accepted, rejected, expired] }
            estimated_total: { $ref: '#/components/schemas/MoneyNullable' }
            expires_at: { type: string, format: date-time }
            created_at: { type: string, format: date-time }
    DealEvent:
      type: object
      required: [to_state, created_at]
      properties:
        from_state: { type: [string, 'null'] }
        to_state: { $ref: '#/components/schemas/DealState' }
        actor_id: { type: [string, 'null'], format: uuid }
        note: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
    Deal:
      type: object
      required: [id, listing_id, offer_id, farmer_id, buyer_id, species, unit, state, agreed_price, agreed_heads, needs_hauler, accepted_at]
      properties:
        id: { type: string, format: uuid }
        listing_id: { type: string, format: uuid }
        offer_id: { type: string, format: uuid }
        farmer_id: { type: string, format: uuid }
        farmer_name: { type: string }
        buyer_id: { type: string, format: uuid }
        buyer_name: { type: string }
        species: { $ref: '#/components/schemas/Species' }
        weight_class: { $ref: '#/components/schemas/WeightClass' }
        unit: { $ref: '#/components/schemas/PriceUnit' }
        state: { $ref: '#/components/schemas/DealState' }
        agreed_price: { $ref: '#/components/schemas/Money' }
        agreed_heads: { type: integer }
        agreed_weight_kg: { $ref: '#/components/schemas/MoneyNullable' }
        estimated_total: { $ref: '#/components/schemas/MoneyNullable' }
        delivered_heads: { type: [integer, 'null'] }
        delivered_weight_kg: { $ref: '#/components/schemas/MoneyNullable' }
        final_total: { $ref: '#/components/schemas/MoneyNullable', description: delivered weight times agreed price, or heads times price for per-head units. }
        needs_hauler: { type: boolean }
        payment_method: { type: [string, 'null'] }
        payment_reference: { type: [string, 'null'] }
        buyer_paid_at: { type: [string, 'null'], format: date-time }
        farmer_confirmed_at: { type: [string, 'null'], format: date-time }
        outlier_flag: { type: boolean }
        counts_for_price: { type: boolean }
        location: { $ref: '#/components/schemas/LocationWithPath' }
        dropoff: { $ref: '#/components/schemas/LocationWithPath' }
        shipment: { $ref: '#/components/schemas/ShipmentSummary' }
        deposit_required: { type: boolean }
        deposit: { $ref: '#/components/schemas/DepositSummary' }
        events:
          type: array
          items: { $ref: '#/components/schemas/DealEvent' }
        accepted_at: { type: string, format: date-time }
        delivered_at: { type: [string, 'null'], format: date-time }
        settled_at: { type: [string, 'null'], format: date-time }
        cancelled_at: { type: [string, 'null'], format: date-time }
    Dispute:
      type: object
      required: [id, deal_id, raised_by, reason, status, created_at]
      properties:
        id: { type: string, format: uuid }
        deal_id: { type: string, format: uuid }
        raised_by: { type: string, format: uuid }
        raised_by_role: { type: string, enum: [farmer, buyer] }
        reason: { type: string }
        details: { type: [string, 'null'] }
        status: { type: string, enum: [open, under_review, resolved_settled, resolved_refunded, dismissed] }
        resolution: { type: [string, 'null'] }
        resolved_by: { type: [string, 'null'], format: uuid }
        deal: { $ref: '#/components/schemas/Deal' }
        created_at: { type: string, format: date-time }
        resolved_at: { type: [string, 'null'], format: date-time }
    ShipmentStatus:
      type: string
      enum: [assigned, picked_up, in_transit, delivered, cancelled]
    HaulerProfileInput:
      type: object
      required: [vehicle_plate, vehicle_type, capacity_heads]
      properties:
        vehicle_plate: { type: string, minLength: 4, maxLength: 12 }
        vehicle_type: { type: string, maxLength: 40, example: Elf truck }
        capacity_heads: { type: integer, minimum: 1, maximum: 500, description: Hogs of 80 to 100 kg or equivalent }
        capacity_kg: { $ref: '#/components/schemas/MoneyNullable' }
        rate_per_head: { $ref: '#/components/schemas/MoneyNullable' }
        rate_per_trip: { $ref: '#/components/schemas/MoneyNullable' }
        service_area:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/PsgcCode' }
          description: Province or municipality codes the hauler serves. Jobs near these show first.
    HaulerProfile:
      allOf:
        - $ref: '#/components/schemas/HaulerProfileInput'
        - type: object
          required: [user_id, verified, created_at]
          properties:
            user_id: { type: string, format: uuid }
            hauler_name: { type: string }
            verified: { type: boolean }
            created_at: { type: string, format: date-time }
    HaulJob:
      type: object
      required: [deal_id, species, heads, pickup, accepted_at]
      properties:
        deal_id: { type: string, format: uuid }
        species: { $ref: '#/components/schemas/Species' }
        weight_class: { $ref: '#/components/schemas/WeightClass' }
        heads: { type: integer }
        estimated_weight_kg: { $ref: '#/components/schemas/MoneyNullable' }
        pickup: { $ref: '#/components/schemas/LocationWithPath' }
        farm_name: { type: string }
        dropoff: { $ref: '#/components/schemas/LocationWithPath' }
        pickup_on: { type: [string, 'null'], format: date }
        fits_capacity: { type: [boolean, 'null'], description: Against the caller's profile; null without a profile. }
        needs: { type: array, items: { type: string }, example: [LGU shipping permit, veterinary health certificate] }
        accepted_at: { type: string, format: date-time }
    ShipmentEvent:
      type: object
      required: [status, created_at]
      properties:
        status: { $ref: '#/components/schemas/ShipmentStatus' }
        kind: { type: [string, 'null'] }
        note: { type: [string, 'null'] }
        geo:
          type: [object, 'null']
          properties:
            lat: { type: number }
            lng: { type: number }
        photo_key: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
    ShipmentSummary:
      type: object
      required: [id, status, hauler_name]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ShipmentStatus' }
        hauler_id: { type: string, format: uuid }
        hauler_name: { type: string }
        vehicle_plate: { type: [string, 'null'] }
        shipping_permit_no: { type: [string, 'null'] }
        vet_health_cert_no: { type: [string, 'null'] }
        head_count_at_pickup: { type: [integer, 'null'] }
        agreed_fee: { $ref: '#/components/schemas/MoneyNullable' }
        scheduled_pickup_at: { type: [string, 'null'], format: date-time }
        picked_up_at: { type: [string, 'null'], format: date-time }
        delivered_at: { type: [string, 'null'], format: date-time }
        last_ping:
          type: [object, 'null']
          properties:
            lat: { type: number }
            lng: { type: number }
            at: { type: string, format: date-time }
    Shipment:
      allOf:
        - $ref: '#/components/schemas/ShipmentSummary'
        - type: object
          required: [deal_id, species, heads, pickup]
          properties:
            deal_id: { type: string, format: uuid }
            species: { $ref: '#/components/schemas/Species' }
            heads: { type: integer }
            pickup: { $ref: '#/components/schemas/LocationWithPath' }
            farm_name: { type: string }
            farmer_name: { type: string }
            buyer_name: { type: string }
            dropoff: { $ref: '#/components/schemas/LocationWithPath' }
            photo_keys: { type: array, items: { type: string } }
            cancel_reason: { type: [string, 'null'] }
            deal_state: { $ref: '#/components/schemas/DealState' }
            events:
              type: array
              items: { $ref: '#/components/schemas/ShipmentEvent' }
            created_at: { type: string, format: date-time }
    DepositStatus:
      type: string
      enum: [pending, paid, lapsed, released, forfeited, refunded]
    DepositSummary:
      type: object
      required: [id, status, amount, expires_at]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/DepositStatus' }
        amount: { $ref: '#/components/schemas/Money', description: 'What the buyer pays: booking plus commission.' }
        booking: { $ref: '#/components/schemas/Money', description: 'The farmer assurance. The only figure ever promised to the farmer.' }
        commission: { $ref: '#/components/schemas/Money', description: 'Platform fee, added on top of the booking and earned only if the deal settles. Zero unless COMMISSION_PERCENT is set.' }
        expires_at: { type: string, format: date-time, description: 'Pay-by time while pending.' }
        paid_at: { type: [string, 'null'], format: date-time }
        closed_at: { type: [string, 'null'], format: date-time }
    Deposit:
      allOf:
        - $ref: '#/components/schemas/DepositSummary'
        - type: object
          required: [deal_id, provider, created_at]
          properties:
            deal_id: { type: string, format: uuid }
            buyer_id: { type: string, format: uuid }
            farmer_id: { type: string, format: uuid }
            buyer_name: { type: string }
            farmer_name: { type: string }
            provider: { type: string }
            checkout_url: { type: [string, 'null'], description: 'Buyer only, while pending.' }
            payment_method: { type: [string, 'null'] }
            fee: { $ref: '#/components/schemas/MoneyNullable' }
            net: { $ref: '#/components/schemas/MoneyNullable' }
            transfer_status: { type: [string, 'null'], enum: [pending, succeeded, failed, null] }
            failure_reason: { type: [string, 'null'] }
            created_at: { type: string, format: date-time }
    DepositTotals:
      type: object
      properties:
        held: { $ref: '#/components/schemas/Money', description: 'Sum of net over paid deposits. What the wallet must hold.' }
        owed_to_farmers: { $ref: '#/components/schemas/Money', description: 'Sum of booking over paid deposits. What is promised to farmers. The gap against held is the gateway fee the platform absorbs.' }
        released: { $ref: '#/components/schemas/Money' }
        forfeited: { $ref: '#/components/schemas/Money' }
        refunded: { $ref: '#/components/schemas/Money' }
        commission_earned: { $ref: '#/components/schemas/Money', description: 'Commission on deposits that reached released. Revenue actually earned.' }
        pending_count: { type: integer }
    PayoutAccountInput:
      type: object
      required: [kind, account_no, account_name]
      properties:
        kind: { type: string, enum: [gcash, bank] }
        account_no: { type: string, minLength: 6, maxLength: 34, description: 'GCash mobile number or bank account number.' }
        account_name: { type: string, minLength: 2, maxLength: 120, description: Must match the name on the ID. }
        bank_code: { type: [string, 'null'], maxLength: 20, description: 'Required for bank.' }
    PayoutAccount:
      allOf:
        - $ref: '#/components/schemas/PayoutAccountInput'
        - type: object
          required: [verified, updated_at]
          properties:
            account_no_masked: { type: string }
            verified: { type: boolean, description: 'True once the one-peso test transfer succeeded.' }
            updated_at: { type: string, format: date-time }
    AdminUserRow:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            province_name: { type: [string, 'null'], description: 'From the first farm, hauler base or delivery point.' }
            deals_count: { type: integer }
            last_seen_at: { type: [string, 'null'], format: date-time }
    ReportSummary:
      type: object
      required: [from, to, deals, users, settlement, disputes, deposits, hauling, thin_municipalities]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        province_code: { type: [string, 'null'] }
        deals:
          type: object
          properties:
            by_state:
              type: array
